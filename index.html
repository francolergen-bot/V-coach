<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-Coach</title>
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="V-Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0f1b2d;--card:#17263d;--card2:#1e3150;--line:#27406a;--tx:#eef3fa;--mu:#8fa3c2;--ac:#ff7a1a;--ok:#2ecc71;--er:#ff5d5d;--wa:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;color:var(--mu);font-weight:400;display:block}
main{padding:14px 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.ttl{font-weight:600}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--card2);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ac);color:#1a0d00}
.btn.dan{background:transparent;color:var(--er);border:1px solid var(--er)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.full{width:100%;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.num{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--mu);font-weight:600;white-space:nowrap}
.badge.ok{background:#12391f;color:var(--ok)}.badge.ok2{background:#1b3a2b;color:#8fe3b0}.badge.er{background:#40191b;color:var(--er)}.badge.wa{background:#3d3210;color:var(--wa)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1525;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 4px 9px;font-size:11px;font-weight:600;cursor:pointer}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--ac)}
input,select,textarea{width:100%;background:#0f1b2d;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 2px;border:0;border-radius:10px;background:var(--card);color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#1a0d00}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--card2);color:var(--tx);border-radius:12px;padding:6px 8px;min-width:54px;text-align:center;font-size:13px;cursor:pointer}
.chip b{display:block;font-size:16px}
.chip.on{border-color:var(--ac);background:#3a2410}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big.g2{grid-template-columns:1fr 1fr}
.big button{border:0;border-radius:14px;padding:11px 4px;font-size:14px;font-weight:700;color:var(--tx);background:var(--card2);cursor:pointer}
.big button.on{background:var(--ac);color:#1a0d00}
.big.res{grid-template-columns:1fr 1fr}
.big.res.c3{grid-template-columns:1fr 1fr 1fr}
.big.res button{padding:18px 4px;font-size:16px}
.big.res.c1{grid-template-columns:1fr}
.big.res .r-pf,.big.res .r-ac,.big.res .r-pt{background:#14612f}.big.res .r-ps{background:#1d4a32}.big.res .r-rg,.big.res .r-ej,.big.res .r-co,.big.res .r-to{background:#34425c}.big.res .r-bl{background:#6b3d12}.big.res .r-er{background:#5a1f22}
.step{font-size:12px;color:var(--mu);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mu);text-transform:uppercase}
td.l,th.l{text-align:left}
.scroll{overflow-x:auto}
.fab{position:fixed;right:max(16px,calc(50vw - 304px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:4;background:var(--ac);color:#1a0d00;border:0;border-radius:99px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px #0008;cursor:pointer}
#modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.att{width:46px;height:38px;border-radius:10px;border:0;font-weight:800;font-size:15px;cursor:pointer}
.att.P{background:#14472a;color:var(--ok)}.att.A{background:#4a1b1e;color:var(--er)}.att.J{background:#3d3210;color:var(--wa)}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
.empty h2{color:var(--tx);margin:0 0 6px;font-size:18px}
textarea.rt{min-height:210px;font-size:14px;line-height:1.4}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:15px;color:var(--tx)}
.chk input{width:20px;height:20px}
.setrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.setrow input{text-align:center}
a{color:var(--ac)}
.pill{display:inline-block;min-width:48px;padding:5px 8px;border-radius:99px;font-weight:700;font-size:13px;text-align:center}
.pill.g{background:#14612f;color:#c4f7d6}.pill.y{background:#6b5a12;color:#ffe48a}.pill.r{background:#6a2226;color:#ffc4c4}.pill.gy{background:#2a3a55;color:#9fb3d1}.pill.na{background:transparent;color:var(--mu)}
.light{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.light.g{background:#1faa57;color:#04210f}.light.y{background:#e8b92a;color:#2b2200}.light.r{background:#e0484c;color:#2a0507}.light.gy{background:#3b4d6b;color:#cdd9ee}.light.na{background:#2a3a55;color:#9fb3d1}
.evo{display:flex;gap:10px}
.evc{text-align:center;font-size:11px;color:var(--mu);flex:none}
.evc .pill{display:block;margin-bottom:4px}
.tcard{position:relative;text-align:center;padding:18px 14px 14px;cursor:pointer;border:2px solid transparent}
.tcard.on{border-color:var(--ac)}
.tcard .pen{position:absolute;top:10px;right:10px}
.logo{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--card2);font-weight:800;font-size:32px;color:var(--mu);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
#printarea{display:none}
.bl{display:block;width:100%;height:100%}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block!important}
  @page{size:A4 portrait;margin:8mm}
}
</style>
</head>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="printarea"></div>
<div id="toast"></div>

/* ===== Datos y persistencia (localStorage, con respaldo en memoria) ===== */
const KEY='voleycoach.v1';
const blank=()=>({id:uid(),team:{name:'Mi equipo',cat:'Sub 16'},players:[],trainings:[],matches:[]});
function migrate(d){
  (d.players||[]).forEach(p=>{delete p.birth;delete p.tutor;delete p.tel;delete p.notes});
  const old={'+':'dp','=':'n','-':'dn'};
  const mp={rec:{dp:'pf',p:'ps',n:'rg',dn:'er'},sav:{dp:'ac',p:'ej',n:'ej',dn:'er'},ata:{dp:'pt',p:'co',n:'co',dn:'er'}};
  d.team=d.team||{name:'Mi equipo',cat:''};
  (d.matches||[]).forEach(m=>{
    m.events=(m.events||[]).filter(e=>e.s!=='ead');
    m.events.forEach(e=>{if(old[e.r])e.r=old[e.r];const t=mp[e.s]&&mp[e.s][e.r];if(t)e.r=t;if(e.s==='ata'&&e.r==='bl')e.r='er'});
    m.events=m.events.filter(e=>!(e.s==='blo'&&e.r!=='pt'));
  });
  return d}
function loadDB(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);
    if(d&&Array.isArray(d.teams)&&d.teams.length){d.teams.forEach(t=>{migrate(t);t.id=t.id||uid()});d.cur=d.cur||d.teams[0].id;return d}
    if(d&&d.players){migrate(d);d.id=d.id||uid();return{teams:[d],cur:d.id}}}}catch(e){}
  const b=blank();return{teams:[b],cur:b.id}}
let DB=loadDB();
let S=DB.teams.find(t=>t.id===DB.cur)||DB.teams[0];
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function replaceCur(o){o.id=S.id;DB.teams[DB.teams.indexOf(S)]=o;S=o}

const POS=['Armador','Punta','Opuesto','Central','Líbero','Sin definir'];
const pc=(a,t)=>t?Math.round(a/t*100)+'%':'–';
const SK={
  rec:{n:'Recepción',s:'Rec',res:[['pf','Perfecta'],['ps','Positiva'],['rg','Regular'],['er','Error']],
    cols:[['Tot',x=>x.t],['Err',x=>x.er],['Pos%',x=>pc(x.pf+x.ps,x.t)],['Perf%',x=>pc(x.pf,x.t)]],
    sum:x=>x.t+' · Pos '+pc(x.pf+x.ps,x.t)+' · Perf '+pc(x.pf,x.t)+' · Err '+x.er,
    note:'Pos% = perfectas + positivas ÷ total · Perf% = perfectas ÷ total'},
  sav:{n:'Saque',s:'Saque',res:[['ac','Ace'],['ej','En juego'],['er','Error']],
    cols:[['Tot',x=>x.t],['Err',x=>x.er],['Err%',x=>pc(x.er,x.t)],['Pts',x=>x.ac]],
    sum:x=>x.t+' · '+x.ac+' aces · '+x.er+' errores',
    note:'Pts = aces · Err% = errores ÷ saques'},
  ata:{n:'Ataque',s:'Ataque',res:[['pt','Punto'],['co','Continúa'],['er','Error / bloqueada']],
    cols:[['Tot',x=>x.t],['Err',x=>x.er],['Pts',x=>x.pt],['Pts%',x=>pc(x.pt,x.t)]],

function light(k,x){
  if(!x||!x.t)return'na';if(x.t<minAct())return'gy';
  const v=METRIC[k](x),t=thr()[k];
  if(k==='sav')return v<=t[0]?'g':v<=t[1]?'y':'r';
  return v>=t[0]?'g':v>=t[1]?'y':'r';
}

const zero=k=>{const o={t:0};SK[k].res.forEach(r=>o[r[0]]=0);return o};
function calc(evs){
  const o={};for(const k in SK)o[k]=zero(k);
  for(const v of evs){const x=o[v.s];if(!x||v.r==='t'||x[v.r]===undefined)continue;x.t++;x[v.r]++}
  return o;
}
function pts(c){

const ensureSets=(m,n)=>{while(m.sets.length<n)m.sets.push({us:'',them:''})};
const playedSets=m=>m.sets.filter(s=>s.us!==''&&s.them!==''&&s.us!=null&&s.them!=null);
const setsWon=m=>{const p=playedSets(m);return{w:p.filter(s=>+s.us>+s.them).length,l:p.filter(s=>+s.us<+s.them).length}};
const resTxt=m=>{if(!playedSets(m).length)return'Sin resultado';const r=setsWon(m);return r.w+' - '+r.l};
function attStats(pid){let p=0,t=0;for(const tr of S.trainings){const v=tr.att[pid];if(v===undefined)continue;t++;if(v==='P')p++}return{p,t,pct:t?Math.round(p/t*100):null}}
const allEvents=pid=>S.matches.flatMap(m=>m.events.filter(e=>e.p===pid));
const matchesAsc=()=>[...S.matches].sort((a,b)=>a.date.localeCompare(b.date));

/* ===== Estado de vista ===== */
const V={tab:'plantel',sub:null,id:null,mtab:'live',selP:null,selS:null,tskill:'rec',pview:'lista',gtab:'diag',setf:'all',curSet:1};
const R={kind:'match',id:null,set:'all',res:true,team:true,players:true,pts:true,light:true,short:false,evo:false,att:false,f:{rec:true,sav:true,ata:true,blo:true}};

/* ===== Piezas de vista ===== */
function skillTabs(){
  return '<div class="tabs">'+Object.keys(SK).map(k=>'<button class="'+(V.tskill===k?'on':'')+'" data-a="tskill" data-k="'+k+'">'+SK[k].s+'</button>').join('')+'<button class="'+(V.tskill==='pts'?'on':'')+'" data-a="tskill" data-k="pts">Puntos</button></div>';
}
function setChips(m){
  const n=nSets(m);
  return '<div class="chips" style="margin-bottom:12px">'+['all'].concat(Array.from({length:n},(_,i)=>i+1)).map(v=>'<button class="chip '+(V.setf===v?'on':'')+'" style="min-width:56px;padding:6px 10px" data-a="setf" data-v="'+v+'">'+(v==='all'?'Todo':'Set '+v)+'</button>').join('')+'</div>';
}
function statTable(evs,players,k){
  const rows=players.map(p=>({p,x:calc(evs.filter(e=>e.p===p.id))[k]})).filter(r=>r.x.t);
  if(!rows.length)return '<div class="mu" style="padding:8px">Sin acciones de '+SK[k].n.toLowerCase()+' todavía.</div>';
  const tot=calc(evs)[k],cols=SK[k].cols;
  const tr=(l,x,b)=>'<tr'+(b?' style="font-weight:700"':'')+'><td class="l">'+l+'</td>'+cols.map(c=>'<td>'+c[1](x)+'</td>').join('')+'</tr>';
  return '<table><tr><th class="l">Jugador</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>'+rows.map(r=>tr('<b>'+esc(r.p.num||'')+'</b> '+esc(short(r.p)),r.x)).join('')+tr('Equipo',tot,1)+'</table>';
}
function ptsTable(evs,players){
  const rows=players.map(p=>{const c=calc(evs.filter(e=>e.p===p.id));return{p,c,q:pts(c)}}).filter(r=>Object.values(r.c).some(x=>x.t));
  if(!rows.length)return '<div class="mu" style="padding:8px">Sin acciones todavía.</div>';
  const tq=pts(calc(evs));
  const tr=(l,q,b)=>'<tr'+(b?' style="font-weight:700"':'')+'><td class="l">'+l+'</td><td>'+q.sq+'</td><td>'+q.at+'</td><td>'+q.bl+'</td><td>'+q.w+'</td></tr>';
  return '<table><tr><th class="l">Jugador</th><th>Saq</th><th>Ata</th><th>Blo</th><th>Total</th></tr>'+rows.map(r=>tr('<b>'+esc(r.p.num||'')+'</b> '+esc(short(r.p)),r.q)).join('')+tr('Equipo',tq,1)+'</table>';
}
const fmt1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
function lightCard(k,x,ns){
  const l=light(k,x);let big='–',sub='Sin acciones';
  if(x.t){
    if(k==='rec'){big=pc(x.pf+x.ps,x.t);sub=(x.pf+x.ps)+' recepciones positivas y perfectas de '+x.t}
    else if(k==='sav'){big=String(x.er);const ps=v=>ns?' ('+fmt1(v/ns)+' por set)':'';sub=x.ac+' aces'+ps(x.ac)+' · '+x.er+' errores'+ps(x.er)+' · '+x.t+' saques'}
    else{big=pc(x.pt,x.t);sub=x.pt+' puntos de '+x.t+' ataques'}
  }
  return '<div class="card row"><div class="light '+l+'">'+big+'</div><div class="grow"><div class="ttl">'+SK[k].n+'</div><div class="mu">'+sub+'</div></div>'+(l==='gy'||l==='na'?'<span class="badge">'+LTXT[l]+'</span>':'')+'</div>';
}
function diagPlayers(evs,players){
  const rows=players.map(p=>({p,c:calc(evs.filter(e=>e.p===p.id))})).filter(r=>LK.some(k=>r.c[k].t));
  if(!rows.length)return '<div class="mu">Sin acciones de recepción, saque o ataque.</div>';
  const cd=(k,x)=>{if(!x.t)return '–';const txt=k==='rec'?pc(x.pf+x.ps,x.t)+' · '+pc(x.pf,x.t):k==='sav'?x.ac+' · '+x.er:pc(x.pt,x.t);return '<span class="pill '+light(k,x)+'">'+txt+'</span>'};
  return '<table><tr><th class="l">Jugador</th><th>Recepción<br>% pos · doble pos</th><th>Saque<br>aces · err</th><th>Ataque<br>% puntos</th></tr>'+rows.map(r=>'<tr><td class="l"><b>'+esc(r.p.num||'')+'</b> '+esc(short(r.p))+'</td>'+LK.map(k=>'<td>'+cd(k,r.c[k])+'</td>').join('')+'</tr>').join('')+'</table>';
}
function diagBody(evs,players,ns){
  if(!evs.length)return '<div class="empty"><h2>Sin datos</h2>Cargá acciones en la pestaña Cargar.</div>';
  const tot=calc(evs);
  return LK.map(k=>lightCard(k,tot[k],ns)).join('')+
   '<div class="card scroll"><div class="ttl" style="margin-bottom:6px">Por jugador</div>'+diagPlayers(evs,players)+'</div>';
}
const EVO_T={rec:'Recepción positiva (Pos%)',sav:'Saque (Err%)',ata:'Ataque (Pts%)'};
function evoBlock(items,keys){
  keys=keys||LK;
  if(!items.length)return '<div class="empty">Todavía no hay partidos con acciones.</div>';
  return keys.map(k=>'<div class="card"><div class="ttl" style="margin-bottom:8px">'+EVO_T[k]+'</div><div class="scroll"><div class="evo">'+items.map(it=>'<div class="evc"><span class="pill '+light(k,it.c[k])+'">'+mval(k,it.c[k])+'</span>'+fdate(it.m.date).slice(0,5)+'</div>').join('')+'</div></div></div>').join('')+
   '<div class="mu" style="margin-bottom:12px">De izquierda a derecha, del partido más viejo al más nuevo.</div>';
}

/* ===== Vistas ===== */
function render(){
  let title=esc(S.team.name),subt=esc(teamLabel(S.team)),back='',body='',fab='';
  if(V.sub==='player'&&P(V.id)){const p=P(V.id);title=esc(p.name);subt='Perfil';back=1;body=vPlayer(p)}
  else if(V.sub==='training'&&T(V.id)){title='Entrenamiento';subt=fdate(T(V.id).date);back=1;body=vTraining(T(V.id))}
  else if(V.sub==='match'&&M(V.id)){const m=M(V.id);title='vs '+esc(m.rival);subt=fdate(m.date)+' · '+resTxt(m);back=1;body=vMatch(m)}
  else{
    V.sub=null;
    if(V.tab==='plantel'){body=vPlantel();fab='<button class="fab" data-a="newPlayer">+ Jugador</button>'}
    else if(V.tab==='entreno'){body=vEntreno()}
    else if(V.tab==='partidos'){body=vPartidos();fab=V.pview==='global'?'':'<button class="fab" data-a="newMatch">+ Partido</button>'}
    else{body=vEquipo();title='Seleccionar equipo';subt='Tocá un equipo para activarlo'}
  }
  const tabs=[['equipo','🏆','Equipo'],['plantel','👥','Plantilla'],['partidos','🏐','Partidos'],['entreno','📋','Entrenos']];
  $('#app').innerHTML=
   '<header>'+(back?'<button class="btn sm" data-a="back">←</button>':'')+'<h1>'+title+'<span class="sub">'+subt+'</span></h1>'+(!back&&DB.teams.length>1?'<button class="btn sm" data-a="teamPick">⇄ Cambiar</button>':'')+'</header>'+
   '<main>'+body+'</main>'+fab+
   '<nav><div class="in">'+tabs.map(t=>'<button class="'+(V.tab===t[0]&&!V.sub?'on':'')+'" data-a="tab" data-t="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join('')+'</div></nav>';
}

function vPlantel(){
  if(!S.players.length)return '<div class="empty"><h2>Todavía no hay jugadores</h2>Agregá el primero con el botón de abajo.<div class="btns" style="justify-content:center"><button class="btn" data-a="demo">Cargar datos de ejemplo</button></div></div>';
  return sorted().map(p=>'<div class="card row" data-a="open" data-s="player" data-i="'+p.id+'"><div class="num">'+esc(p.num||'–')+'</div><div class="grow"><div class="ttl">'+esc(p.name)+'</div><div class="mu">'+psub(p)+'</div></div></div>').join('');
}

const playedM=pid=>S.matches.filter(m=>m.events.some(e=>e.p===pid));
const setsOfPlayed=pid=>playedM(pid).reduce((a,m)=>a+nSets(m),0);
function bloTxt(p,x){
  const n=setsOfPlayed(p.id);
  return x.t+' bloqueos ('+(n?fmt1(x.t/n):'–')+' por set)';
}

function vPlayer(p){
  const a=attStats(p.id),evs=allEvents(p.id),c=calc(evs),q=pts(c),pj=playedM(p.id).length;
  const items=matchesAsc().map(m=>({m,c:calc(m.events.filter(e=>e.p===p.id))})).filter(it=>['rec','ata'].some(k=>it.c[k].t));
  return '<div class="card"><div class="row"><div class="num">'+esc(p.num||'–')+'</div><div class="grow"><div class="ttl">'+esc(p.name)+'</div><div class="mu">'+psub(p)+'</div></div><button class="btn sm" data-a="editPlayer" data-i="'+p.id+'">Editar</button></div>'+
   '</div>'+
   '<div class="card"><div class="ttl" style="margin-bottom:4px">Estadística acumulada</div>'+
   '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="width:84px;font-weight:600">Partidos</div><div class="grow mu" style="color:var(--tx)">'+pj+' jugados</div></div>'+
   Object.keys(SK).map(k=>{const x=c[k],l=LK.includes(k)?light(k,x):null;return '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="width:84px;font-weight:600">'+SK[k].n+'</div><div class="grow mu" style="color:var(--tx)">'+(x.t?(k==='blo'?bloTxt(p,x):SK[k].sum(x)):'Sin acciones')+'</div>'+(l?'<span class="pill '+l+'">'+(k==='sav'?(x.t?x.er+' err':'–'):mval(k,x))+'</span>':'')+'</div>'}).join('')+
   '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="width:84px;font-weight:600">Puntos</div><div class="grow mu" style="color:var(--tx)">'+(pj?'Totales '+q.w+' · '+fmt1(q.w/pj)+' por partido':'Sin acciones')+'</div></div></div>'+
   (items.length?'<div class="step">Evolución partido a partido</div>'+evoBlock(items,['rec','ata']):'')+
   '<button class="btn pri full" data-a="report" data-k="player" data-i="'+p.id+'">Compartir reporte del jugador</button>'+
   '<div class="card"><div class="ttl">Asistencia</div><div class="mu">'+(a.t?a.p+' de '+a.t+' entrenamientos · '+a.pct+'%':'Sin entrenamientos cargados')+'</div></div>';
}

function vEntreno(){
  const list=[...S.trainings].sort((a,b)=>b.date.localeCompare(a.date));
  let h='<div class="btns"><button class="btn pri" data-a="newTraining">+ Nuevo entrenamiento</button>'+'</div>';
  if(!list.length)return h+'<div class="empty"><h2>Sin entrenamientos</h2>Creá uno y marcá solo las ausencias: todos arrancan como presentes.</div>';
  return h+list.map(t=>{const ids=Object.keys(t.att),pres=ids.filter(i=>t.att[i]==='P').length;
    return '<div class="card row" data-a="open" data-s="training" data-i="'+t.id+'"><div class="grow"><div class="ttl">'+fdate(t.date)+'</div><div class="mu">Presentes '+pres+' de '+ids.length+'</div>'+(t.note?'<div class="mu" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📝 '+esc(t.note.split('\n')[0])+'</div>':'')+'</div><span class="badge '+(ids.length&&pres/ids.length>=.8?'ok':'wa')+'">'+(ids.length?Math.round(pres/ids.length*100):0)+'%</span></div>'}).join('');
}

function vTraining(t){
  const pl=sorted().filter(p=>t.att[p.id]!==undefined);
  const c={P:0,A:0,J:0};pl.forEach(p=>c[t.att[p.id]]++);
  const missing=sorted().filter(p=>t.att[p.id]===undefined);
  return '<div class="card"><label style="margin-top:0">Fecha</label><input type="date" value="'+t.date+'" data-c="tdate" data-i="'+t.id+'"><div class="mu" style="margin-top:10px">Tocá para cambiar: P presente · A ausente · J justificada</div><div class="mu"><b style="color:var(--ok)">'+c.P+' P</b> · <b style="color:var(--er)">'+c.A+' A</b> · <b style="color:var(--wa)">'+c.J+' J</b></div></div>'+
   pl.map(p=>'<div class="card row" style="padding:10px 14px"><div class="num" style="width:36px;height:36px;font-size:15px">'+esc(p.num||'–')+'</div><div class="grow ttl">'+esc(p.name)+'</div><button class="att '+t.att[p.id]+'" data-a="att" data-t="'+t.id+'" data-i="'+p.id+'">'+t.att[p.id]+'</button></div>').join('')+
   (missing.length?'<div class="btns"><button class="btn sm" data-a="addToTraining" data-t="'+t.id+'">+ Sumar '+missing.length+' jugador'+(missing.length>1?'es':'')+' nuevo'+(missing.length>1?'s':'')+'</button></div>':'')+
   '<div class="card"><div class="ttl">Notas del entrenamiento</div><textarea rows="4" data-c="tnote" data-i="'+t.id+'" placeholder="Qué se trabajó, qué salió bien, qué falta…" style="margin-top:8px">'+esc(t.note||'')+'</textarea><div class="mu" style="margin-top:6px">Privadas: no salen en los reportes. Se guardan al salir del cuadro.</div></div>'+
   '<div class="btns"><button class="btn dan sm" data-a="delTraining" data-i="'+t.id+'">Eliminar entrenamiento</button></div>';
}

function vPartidos(){
  const seg='<div class="tabs"><button class="'+(V.pview!=='global'?'on':'')+'" data-a="pview" data-t="lista">Partidos</button><button class="'+(V.pview==='global'?'on':'')+'" data-a="pview" data-t="global">Global</button></div>';
  if(V.pview==='global')return seg+vGlobal();
  const list=[...S.matches].sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length)return seg+'<div class="empty"><h2>Sin partidos</h2>Cargá el primero y registrá las acciones durante el partido o después.<div class="btns" style="justify-content:center"><button class="btn" data-a="demo">Cargar datos de ejemplo</button></div></div>';
  return seg+list.map(m=>{const r=setsWon(m);const cls=!playedSets(m).length?'':r.w>r.l?'ok':'er';
    return '<div class="card row" data-a="open" data-s="match" data-i="'+m.id+'"><div class="grow"><div class="ttl">vs '+esc(m.rival)+'</div><div class="mu">'+fdate(m.date)+' · '+(m.home?'Local':'Visitante')+' · '+m.events.length+' acciones</div></div><span class="badge '+cls+'">'+resTxt(m)+'</span></div>'}).join('');
}

function vGlobal(){
  const evs=S.matches.flatMap(m=>m.events);let w=0,l=0;
  S.matches.forEach(m=>{if(!playedSets(m).length)return;const r=setsWon(m);if(r.w>r.l)w++;else if(r.w<r.l)l++});
  const head='<div class="card row" style="justify-content:space-around;text-align:center"><div><div class="ttl">'+S.matches.length+'</div><div class="mu">Partidos</div></div><div><div class="ttl" style="color:var(--ok)">'+w+'</div><div class="mu">Ganados</div></div><div><div class="ttl" style="color:var(--er)">'+l+'</div><div class="mu">Perdidos</div></div></div>';
  if(!evs.length)return head+'<div class="empty"><h2>Sin estadísticas globales</h2>Se arman solas con las acciones de todos los partidos.</div>';
  const gt=[['diag','Diagnóstico'],['tabla','Tablas'],['evo','Evolución']];
  let h=head+'<div class="tabs">'+gt.map(t=>'<button class="'+(V.gtab===t[0]?'on':'')+'" data-a="gtab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(V.gtab==='diag')h+=diagBody(evs,sorted(),S.matches.filter(m=>m.events.length).reduce((a,m)=>a+nSets(m),0));
  else if(V.gtab==='tabla')h+=skillTabs()+'<div class="card scroll">'+(V.tskill==='pts'?ptsTable(evs,sorted()):statTable(evs,sorted(),V.tskill))+'</div>';
  else h+=evoBlock(matchesAsc().map(m=>({m,c:calc(m.events)})).filter(it=>LK.some(k=>it.c[k].t)));
  return h+'<button class="btn pri full" data-a="report" data-k="global">Compartir reporte global</button><button class="btn full" data-a="sheet" data-k="global">Planilla de la temporada (PDF)</button>';
}

function vMatch(m){
  const tabs=[['live','Cargar'],['diag','Diagnóstico'],['tabla','Tabla'],['datos','Datos']];
  let h='<div class="tabs">'+tabs.map(t=>'<button class="'+(V.mtab===t[0]?'on':'')+'" data-a="mtab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(V.mtab==='live')h+=vLive(m);else if(V.mtab==='diag')h+=vDiag(m);else if(V.mtab==='tabla')h+=vTabla(m);else h+=vDatos(m);
  return h;
}

function vLive(m){
  const squad=sorted().filter(p=>m.squad.includes(p.id));
  if(!squad.length)return '<div class="empty">No hay jugadores convocados. Elegilos en la pestaña Datos.</div>';
  const cur=V.curSet,n=Math.max(nSets(m),cur),cs=m.sets[cur-1]||{},done=!!cs.done;
  let h='<div class="card"><div class="chips">'+Array.from({length:n},(_,i)=>'<button class="chip '+(cur===i+1?'on':'')+'" style="min-width:56px" data-a="curSet" data-n="'+(i+1)+'">Set '+(i+1)+((m.sets[i]||{}).done?' ✓':'')+'</button>').join('')+'<button class="chip" style="min-width:56px" data-a="addSet2">+ Set</button></div>'+
   '<div class="row" style="margin-top:10px"><div class="mu grow">'+m.events.filter(e=>setOf(e)===cur).length+' acciones cargadas en este set'+(done?' · terminado '+esc(cs.us)+'-'+esc(cs.them):'')+'</div>'+(done?'<button class="btn sm" data-a="reopenSet">Reabrir</button>':'<button class="btn sm" data-a="endSet">Terminar set</button>')+'</div></div>';
  if(done){
    const last0=[...m.events].slice(-3).reverse();
    return h+'<div class="empty" style="padding:22px 12px"><h2>Set '+cur+' terminado</h2>Para cargar o corregir acciones de este set, tocá Reabrir.</div>'+
     (last0.length?'<div class="step">Últimas cargas</div><div class="card" style="padding:6px 14px">'+last0.map((e,i)=>{const p=P(e.p);return '<div class="row" style="padding:8px 0;'+(i?'border-top:1px solid var(--line)':'')+'"><div class="grow">#'+esc(p?p.num:'?')+' '+esc(p?short(p):'—')+' · '+SK[e.s].n+' <span class="mu">· set '+setOf(e)+'</span></div><span class="badge '+lvCls(e.r)+'">'+resLabel(e.s,e.r)+'</span></div>'}).join('')+'</div>':'');
  }
  h+='<div class="step">1 · Jugador</div><div class="chips">'+squad.map(p=>'<button class="chip '+(V.selP===p.id?'on':'')+'" data-a="selP" data-i="'+p.id+'"><b>'+esc(p.num||'–')+'</b>'+esc(short(p))+'</button>').join('')+'</div>';
  if(V.selP&&P(V.selP)){
    h+='<div class="step">2 · Fundamento</div><div class="big g2">'+Object.keys(SK).map(k=>'<button class="'+(V.selS===k?'on':'')+'" data-a="selS" data-k="'+k+'">'+SK[k].n+'</button>').join('')+'</div>';
    if(V.selS){const rs=SK[V.selS].res;h+='<div class="step">3 · Resultado</div><div class="big res'+(rs.length===3?' c3':rs.length===1?' c1':'')+'">'+rs.map(r=>'<button class="r-'+r[0]+'" data-a="res" data-r="'+r[0]+'">'+r[1]+'</button>').join('')+'</div>'}
  }else h+='<div class="mu" style="margin-top:14px">Tocá un jugador, después el fundamento y el resultado.</div>';
  
  const last=[...m.events].slice(-3).reverse();
  if(last.length)h+='<div class="step">Últimas cargas</div><div class="card" style="padding:6px 14px">'+last.map((e,i)=>{const p=P(e.p);return '<div class="row" style="padding:8px 0;'+(i?'border-top:1px solid var(--line)':'')+'"><div class="grow">'+'#'+esc(p?p.num:'?')+' '+esc(p?short(p):'—')+' · '+SK[e.s].n+' <span class="mu">· set '+setOf(e)+'</span></div>'+'<span class="badge '+lvCls(e.r)+'">'+resLabel(e.s,e.r)+'</span>'+(i===0?'<button class="btn sm" data-a="undo">Deshacer</button>':'')+'</div>'}).join('')+'</div>';
  return h;
}

function vDiag(m){
  if(!m.events.length)return '<div class="empty"><h2>Sin datos</h2>Cargá acciones en la pestaña Cargar.</div>';
  const squad=sorted().filter(p=>m.squad.includes(p.id));
  return setChips(m)+diagBody(evsOf(m,V.setf),squad,V.setf==='all'?nSets(m):1)+
   '<button class="btn pri full" data-a="report" data-k="match" data-i="'+m.id+'">Compartir reporte'+(V.setf==='all'?' del partido':' del set '+V.setf)+'</button>'+

const dn=p=>R.short?short(p):p.name;
const lightTxt=(k,x)=>R.light&&LK.includes(k)&&x.t?' '+LEMO[light(k,x)]:'';
const pillH=(k,x)=>'<span class="pill '+light(k,x)+'">'+(x.t?mval(k,x)+' · ':'')+LTXT[light(k,x)]+'</span>';
const REP_NOTE='Pos% = perfectas + positivas ÷ recepciones · Err% = errores ÷ saques · Pts% = puntos ÷ ataques';
function buildReport(){
  const team=S.team.name+(teamLabel(S.team)?' · '+teamLabel(S.team):'');
  let text='',html='',title='';
  const parts=(evs,players)=>{
    let t='',h='';const tot=calc(evs);
    if(R.team&&evs.length){
      t+='\nEquipo\n'+Object.keys(SK).filter(k=>tot[k].t).map(k=>'• '+SK[k].n+': '+SK[k].sum(tot[k])+lightTxt(k,tot[k])).join('\n')+'\n';
      h+='<h2>Equipo</h2><table><tr><th>Fundamento</th><th>Resultado</th>'+(R.light?'<th class="n">Estado</th>':'')+'</tr>'+Object.keys(SK).filter(k=>tot[k].t).map(k=>'<tr><td><b>'+SK[k].n+'</b></td><td>'+esc(SK[k].sum(tot[k]))+'</td>'+(R.light?'<td class="n">'+(LK.includes(k)?pillH(k,tot[k]):'')+'</td>':'')+'</tr>').join('')+'</table>';
    }
    if(R.pts&&evs.length){
      const q=pts(tot),w=q.w;
      t+='\nPuntos\n• Ganados '+w+' (saque '+q.sq+' · ataque '+q.at+' · bloqueo '+q.bl+')\n';
      h+='<h2>Puntos</h2><p>Ganados <b>'+w+'</b> (saque '+q.sq+' · ataque '+q.at+' · bloqueo '+q.bl+')</p>';
    }
    if(R.players&&evs.length){
      const rows=players.map(p=>({p,c:calc(evs.filter(e=>e.p===p.id))})).filter(r=>Object.values(r.c).some(x=>x.t));
      t+='\nPor jugador\n'+rows.map(r=>{const q=pts(r.c);return '#'+(r.p.num||'–')+' '+dn(r.p)+' — '+Object.keys(SK).filter(k=>r.c[k].t).map(k=>SK[k].s+' '+SK[k].sum(r.c[k])+lightTxt(k,r.c[k])).join(' | ')+(R.pts?' | Pts '+q.w:'')}).join('\n')+'\n';
      Object.keys(SK).forEach(k=>{
        const rr=rows.filter(r=>r.c[k].t);if(!rr.length)return;const cols=SK[k].cols;
        h+='<h2>'+SK[k].n+'</h2><table><tr><th>Jugador</th>'+cols.map(c=>'<th class="n">'+c[0]+'</th>').join('')+(R.light&&LK.includes(k)?'<th class="n">Estado</th>':'')+'</tr>'+
          rr.map(r=>'<tr><td><b>'+esc(r.p.num||'')+'</b> '+esc(dn(r.p))+'</td>'+cols.map(c=>'<td class="n">'+c[1](r.c[k])+'</td>').join('')+(R.light&&LK.includes(k)?'<td class="n">'+pillH(k,r.c[k])+'</td>':'')+'</tr>').join('')+
          '<tr style="font-weight:700"><td>Equipo</td>'+cols.map(c=>'<td class="n">'+c[1](tot[k])+'</td>').join('')+(R.light&&LK.includes(k)?'<td></td>':'')+'</tr></table><div class="sub" style="font-size:12px;margin-top:6px">'+SK[k].note+'</div>';
      });
    }
    return{t,h};
  };
  if(R.kind==='match'){
    const m=M(R.id);if(!m)return{text:'',html:'',title:''};
    const setTag=R.set==='all'?'':' · Set '+R.set;
    title=team+' vs '+m.rival+setTag;
    text='🏐 '+team+' vs '+m.rival+setTag+'\n'+fdate(m.date)+' · '+(m.home?'Local':'Visitante')+'\n';
    html='<h1>'+esc(team)+' vs '+esc(m.rival)+esc(setTag)+'</h1><div class="sub">'+fdate(m.date)+' · '+(m.home?'Local':'Visitante')+'</div>';
    if(R.res&&playedSets(m).length){
      if(R.set==='all'){const r=setsWon(m);text+='\nResultado: '+r.w+'-'+r.l+' ('+playedSets(m).map(s=>s.us+'-'+s.them).join(', ')+')\n';
        html+='<h2>Resultado</h2><p><b style="font-size:22px">'+r.w+' - '+r.l+'</b><br><span class="sub">'+playedSets(m).map(s=>s.us+'-'+s.them).join(' · ')+'</span></p>'}
      else{const s=m.sets[R.set-1];if(s&&s.us!==''&&s.them!==''){text+='\nResultado del set '+R.set+': '+s.us+'-'+s.them+'\n';html+='<h2>Resultado del set '+R.set+'</h2><p><b style="font-size:22px">'+esc(s.us)+' - '+esc(s.them)+'</b></p>'}}
    }
    const q=parts(evsOf(m,R.set),sorted().filter(p=>m.squad.includes(p.id)));text+=q.t;html+=q.h;
  }else if(R.kind==='global'){
    title=team+' · Estadísticas globales';
    let w=0,l=0;S.matches.forEach(m=>{if(!playedSets(m).length)return;const r=setsWon(m);if(r.w>r.l)w++;else if(r.w<r.l)l++});
    const sum=S.matches.length+' partidos · '+w+' ganados · '+l+' perdidos';
    text='🏐 '+team+'\nEstadísticas globales\n'+sum+'\n';
    html='<h1>'+esc(team)+'</h1><div class="sub">Estadísticas globales · '+esc(sum)+'</div>';
    const q=parts(S.matches.flatMap(m=>m.events),sorted());text+=q.t;html+=q.h;
  }else if(R.kind==='player'){
    const p=P(R.id);if(!p)return{text:'',html:'',title:''};
    const c=calc(allEvents(p.id)),label=(p.num?'#'+p.num+' ':'')+p.name;
    title=team+' · '+p.name;
    text='🏐 '+team+'\n'+label+'\nAcumulado de la temporada\n';
    html='<h1>'+esc(label)+'</h1><div class="sub">'+esc(team)+' · acumulado de la temporada</div>';
    const ks=Object.keys(SK).filter(k=>R.f[k]&&c[k].t);
    if(ks.length){
      text+='\nFundamentos\n'+ks.map(k=>'• '+SK[k].n+': '+SK[k].sum(c[k])+lightTxt(k,c[k])).join('\n')+'\n';

function demo(){

  const names=[['Mateo Gómez','Armador',1],['Lucas Pérez','Punta',4],['Tomás Ruiz','Punta',7],['Joaquín Sosa','Opuesto',9],['Bruno Díaz','Central',11],['Santino Vega','Central',12],['Facundo Ríos','Líbero',3],['Nicolás Paz','Punta',15],['Agustín Luna','Armador',2],['Ignacio Mora','Opuesto',10]];
  replaceCur(blank());S.team={name:'Club Atlético Juniors',cat:'Sub 16',gender:'Masculino',comp:'Liga Regional'};
  const fx={};
  S.players=names.map(n=>{const id=uid();fx[id]={rec:.6+rnd()*1.0,sav:.6+rnd()*1.0,ata:.6+rnd()*1.0,blo:.6+rnd()*1.0};return{id,name:n[0],pos:n[1],num:String(n[2]),h:String(168+Math.floor(rnd()*28))}});
  const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  [14,11,7,4,2].forEach(n=>{const att={};S.players.forEach(p=>att[p.id]=rnd()<.15?'A':rnd()<.05?'J':'P');S.trainings.push({id:uid(),date:day(n),att})});
  const W={rec:[.3,.35,.25,.1],sav:[.1,.75,.15],ata:[.3,.4,.3],blo:[1]};
  const base={rec:{'Líbero':5,'Punta':4,'Armador':1,'Opuesto':1,'Central':0},sav:{},ata:{'Líbero':0,'Central':2,'Punta':3,'Opuesto':3,'Armador':1},blo:{'Líbero':0,'Central':2,'Punta':1,'Opuesto':1,'Armador':1}};
  const pick=(k,f)=>{const r=Math.pow(rnd(),f),rs=SK[k].res;let a=0;for(let j=0;j<rs.length;j++){a+=W[k][j];if(r<a)return rs[j][0]}return rs[rs.length-1][0]};
  const cnt=(p,k)=>{const b=base[k][p.pos]!==undefined?base[k][p.pos]:2;return b?b+Math.floor(rnd()*2):0};
  const mk=(rival,n,sets,home)=>{

    });

  mk('Estudiantes',3,[{us:20,them:25},{us:25,them:23},{us:19,them:25},{us:21,them:25}],false);
  mk('Sportivo Sur',1,[{us:25,them:22},{us:25,them:20},{us:25,them:23}],true);

}

    nt.season=sm?String(+sm[1]+1)+(sm[2]?'/'+String(+sm[2]+1).slice(-sm[2].length):''):'';
    const n={id:uid(),team:nt,players:t.players.map(p=>({id:uid(),name:p.name,num:p.num,pos:p.pos,h:p.h})),trainings:[],matches:[]};
    DB.teams.push(n);S=n;DB.cur=n.id;V.sub=null;V.pview='lista';V.selP=null;save();closeModal();render();toast('Temporada creada · ajustá categoría y plantel');teamForm(n.id)},
  pickLogo(){const f=$('#f_logo');if(f)f.click()},
  clearLogo(){tmpLogo=null;$('#logoBox').innerHTML=logoHTML(null,$('#f_tname').value)},
  thrDefault(){['rec','sav','ata'].forEach(k=>{$('#f_'+k+'0').value=DEF_THR[k][0];$('#f_'+k+'1').value=DEF_THR[k][1]});$('#f_min').value=8},
  saveTeam(d){const name=$('#f_tname').value.trim();if(!name){toast('Falta el nombre');return}
    const info={name,cat:$('#f_tcat').value.trim(),season:$('#f_tseas').value.trim(),gender:$('#f_tgen').value,comp:$('#f_tcomp').value.trim()};
    if(tmpLogo)info.logo=tmpLogo;
    if(d.i){const t=DB.teams.find(x=>x.id===d.i);if(!t)return;
      const old=t.team;t.team=Object.assign({},old,info);if(!tmpLogo)delete t.team.logo;
      if($('#f_rec0')){const n=id=>{const v=parseFloat($('#'+id).value);return isNaN(v)?null:v};const thr2={};
        ['rec','sav','ata'].forEach(k=>{const a=n('f_'+k+'0'),b=n('f_'+k+'1');thr2[k]=[a===null?DEF_THR[k][0]:a,b===null?DEF_THR[k][1]:b]});
        t.team.thr=thr2;t.team.min=Math.max(1,parseInt($('#f_min').value)||8)}
      save();closeModal();render();toast('Equipo guardado')}
    else{const b=blank();b.team=info;DB.teams.push(b);S=b;DB.cur=b.id;V.sub=null;V.pview='lista';save();closeModal();render();toast('Equipo creado')}},
  sheet(d){PL.kind=d.k;PL.id=d.i||null;PL.set=d.k==='match'?V.setf:'all';sheetModal()},
  plPrint(){const pa=$('#printarea');pa.innerHTML=planHTML();try{window.print()}catch(e){toast('Este navegador no deja imprimir acá: usá Descargar HTML')}},
  plDl(){saveFile('planilla-'+(PL.kind==='match'?'partido':'temporada')+'.html',planDoc())},
  askOk(){const f=askFn;askFn=null;closeModal();if(f)f()},
  switchTeam(d){const t=DB.teams.find(x=>x.id===d.i);if(!t)return;S=t;DB.cur=t.id;V.sub=null;V.pview='lista';V.selP=null;V.selS=null;save();closeModal();render();window.scrollTo(0,0);toast('Equipo: '+t.team.name)},
  delTeam(d){const t=DB.teams.find(x=>x.id===d.i)||S;ask('¿Eliminar "'+t.team.name+'" con toda su plantilla, entrenamientos y partidos? No se puede deshacer.','Eliminar equipo',()=>{
    DB.teams=DB.teams.filter(x=>x!==t);if(!DB.teams.length)DB.teams.push(blank());if(S===t){S=DB.teams[0];DB.cur=S.id}V.sub=null;V.pview='lista';V.selP=null;save();render();toast('Equipo eliminado')})},
  teamPick(){teamPickModal()},
  newPlayer(){playerForm()},
  editPlayer(d){playerForm(P(d.i))},
  savePlayer(d){
    const name=$('#f_name').value.trim();if(!name){toast('Falta el nombre');return}
    const o={name,num:$('#f_num').value.trim(),pos:$('#f_pos').value,h:$('#f_h').value.trim()};
    if(d.i){Object.assign(P(d.i),o)}else{S.players.push({id:uid(),...o})}
    save();closeModal();render();
  },
  delPlayer(d){ask('¿Eliminar a este jugador? Se pierden sus notas y estadísticas.','Eliminar jugador',()=>{
    S.players=S.players.filter(p=>p.id!==d.i);S.trainings.forEach(t=>delete t.att[d.i]);S.matches.forEach(m=>{m.events=m.events.filter(e=>e.p!==d.i);m.squad=m.squad.filter(x=>x!==d.i)});
    save();V.sub=null;render();toast('Jugador eliminado')})},
  newTraining(){const att={};S.players.forEach(p=>att[p.id]='P');if(!S.players.length){toast('Primero cargá jugadores');return}const t={id:uid(),date:todayISO(),att};S.trainings.push(t);save();V.sub='training';V.id=t.id;render()},
  att(d){const t=T(d.t),c={P:'A',A:'J',J:'P'};t.att[d.i]=c[t.att[d.i]];save();render()},
  addToTraining(d){const t=T(d.t);S.players.forEach(p=>{if(t.att[p.id]===undefined)t.att[p.id]='P'});save();render()},
  delTraining(d){ask('¿Eliminar este entrenamiento?','Eliminar',()=>{S.trainings=S.trainings.filter(t=>t.id!==d.i);save();V.sub=null;render()})},
  newMatch(){if(!S.players.length){toast('Primero cargá jugadores');return}matchForm()},
  editMatch(d){matchForm(M(d.i))},
  saveMatch(d){const rival=$('#f_rival').value.trim();if(!rival){toast('Falta el rival');return}
    const o={rival,date:$('#f_date').value||todayISO(),home:$('#f_home').value==='1',venue:$('#f_venue').value.trim(),stage:$('#f_stage').value.trim()};
    if(d.i)Object.assign(M(d.i),o);else{if(!tmpSquad.length){toast('Elegí al menos un jugador');return}const m={id:uid(),sets:[],squad:[...tmpSquad],events:[],...o};S.matches.push(m);V.sub='match';V.id=m.id;V.mtab='live';V.selP=null;V.selS=null;V.setf='all';V.curSet=1}
    save();closeModal();render()},
  delMatch(d){ask('¿Eliminar este partido y sus estadísticas?','Eliminar partido',()=>{S.matches=S.matches.filter(m=>m.id!==d.i);save();V.sub=null;render();toast('Partido eliminado')})},
  mtab(d){V.mtab=d.t;render()},
  tskill(d){V.tskill=d.k;render()},
  pview(d){V.pview=d.t;render()},
  gtab(d){V.gtab=d.t;render()},
  setf(d){V.setf=d.v==='all'?'all':+d.v;render()},
  addSet(d){const m=M(d.i);ensureSets(m,m.sets.length+1);save();render()},
  delSet(d){const m=M(d.i),n=+d.n+1;
    const go=()=>{m.events=m.events.filter(e=>setOf(e)!==n);m.events.forEach(e=>{if(setOf(e)>n)e.set=setOf(e)-1});m.sets.splice(n-1,1);
      if(V.curSet>Math.max(1,nSets(m)))V.curSet=Math.max(1,nSets(m));if(V.setf!=='all'&&V.setf>nSets(m))V.setf='all';V.evSet='all';save();render()};
    if(m.events.some(e=>setOf(e)===n))ask('Ese set tiene acciones cargadas. ¿Eliminar el set y sus acciones?','Eliminar set',go);else go()},
  squad(d){const m=M(d.i);m.squad=m.squad.includes(d.p)?m.squad.filter(x=>x!==d.p):[...m.squad,d.p];save();render()},
  curSet(d){V.curSet=+d.n;ensureSets(M(V.id),V.curSet);save();render()},
  addSet2(){const m=M(V.id);V.curSet=nSets(m)+1;ensureSets(m,V.curSet);save();render()},
  endSet(){endSetForm(M(V.id))},
  saveEndSet(d){const m=M(V.id),us=$('#f_us').value.trim(),them=$('#f_them').value.trim();
    if(us===''||them===''){toast('Cargá los dos puntajes');return}
    ensureSets(m,V.curSet);m.sets[V.curSet-1]={us,them,done:true};
    if(d.next==='1'){V.curSet++;ensureSets(m,V.curSet)}
    V.selP=null;V.selS=null;save();closeModal();render();toast('Set guardado')},
  selP(d){V.selP=V.selP===d.i?null:d.i;V.selS=null;render()},
  selS(d){V.selS=d.k;render()},
  reopenSet(){const m=M(V.id),x=m.sets[V.curSet-1];if(x)delete x.done;save();render();toast('Set reabierto')},
  res(d){const m=M(V.id);if(!V.selP||!V.selS)return;if((m.sets[V.curSet-1]||{}).done){toast('Set terminado: tocá Reabrir');return}m.events.push({p:V.selP,s:V.selS,r:d.r,set:V.curSet});V.selS=null;save();render();if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}},
  
  undo(){const m=M(V.id);m.events.pop();save();render()},
  report(d){R.kind=d.k;R.id=d.i||null;if(d.k==='match')R.set=V.setf;reportModal()},
  async copyRep(){const t=$('#rtxt').value;try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){const ta=$('#rtxt');ta.select();try{document.execCommand('copy');toast('Copiado')}catch(_){toast('Seleccioná el texto y copialo')}}},
  dlRep(){const b=buildReport();saveFile('reporte-'+({match:'partido',global:'global',player:'jugador'}[R.kind])+'.html',b.html)},
  export(){saveFile('v-coach-respaldo-'+todayISO()+'.json',JSON.stringify(DB,null,2))},
  importPick(){$('#imp').click()},
  demo(){if(S.players.length)ask('Esto reemplaza los datos del equipo activo. ¿Seguir?','Cargar ejemplo',()=>demo());else demo()},
  reset(){ask('¿Borrar TODOS los datos de todos los equipos? No se puede deshacer.','Borrar todo',()=>{const b=blank();DB={teams:[b],cur:b.id};S=b;save();V.sub=null;V.pview='lista';render();toast('Datos borrados')})}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
  const f=A[el.dataset.a];if(f)f(el.dataset,el)
});
document.addEventListener('change',e=>{
  const el=e.target,c=el.dataset&&el.dataset.c;
  if(el.id==='imp'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
    if(Array.isArray(d.teams)&&d.teams.length){ask('Restaurar el respaldo reemplaza TODOS los datos actuales ('+d.teams.length+' equipo'+(d.teams.length>1?'s':'')+' en el archivo). ¿Seguir?','Restaurar',()=>{d.teams.forEach(t=>{migrate(t);t.id=t.id||uid()});d.cur=d.cur||d.teams[0].id;DB=d;S=DB.teams.find(t=>t.id===DB.cur)||DB.teams[0];save();V.sub=null;render();toast('Respaldo restaurado')})}
    else if(d.players){migrate(d);d.id=uid();DB.teams.push(d);S=d;DB.cur=d.id;save();V.sub=null;render();toast('Respaldo agregado como equipo nuevo')}
    else throw 0;
    }catch(_){toast('Archivo inválido')}el.value=''};r.readAsText(f);return}
  if(el.id==='f_logo'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{try{const k=Math.min(1,192/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);tmpLogo=cv.toDataURL('image/png');$('#logoBox').innerHTML=logoHTML(tmpLogo,$('#f_tname').value)}catch(_){toast('No se pudo leer la imagen')}};im.onerror=()=>toast('Imagen inválida');im.src=r.result};r.readAsDataURL(f);return}
  if(!c)return;
  if(c==='tnote'){T(el.dataset.i).note=el.value;save();toast('Nota guardada')}
  else if(c==='tdate'){T(el.dataset.i).date=el.value||todayISO();save();render()}
  else if(c==='set'){const m=M(el.dataset.i);m.sets[+el.dataset.n][el.dataset.f]=el.value;save();$('header h1').innerHTML=esc('vs '+m.rival)+'<span class="sub">'+fdate(m.date)+' · '+resTxt(m)+'</span>'}
  else if(c==='ropt'){R[el.dataset.k]=el.checked;reportModal()}
  else if(c==='rf'){R.f[el.dataset.k]=el.checked;reportModal()}
  else if(c==='evSkill'){const sel=$('#e_r');sel.innerHTML=SK[el.value].res.map(r=>'<option value="'+r[0]+'">'+esc(r[1])+'</option>').join('')}
  else if(c==='pset'){PL.set=el.value==='all'?'all':+el.value;sheetModal()}
  else if(c==='popt'){PL.light=el.checked;sheetModal()}
  else if(c==='rset'){R.set=el.value==='all'?'all':+el.value;reportModal()}
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
